<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2A59B8" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GRID CLASH" />
    <meta name="application-name" content="GRID CLASH" />
    <title>GRID CLASH — 12×12 전술 아레나</title>
    <meta
      name="description"
      content="말 3개, 144칸, 60초의 수 싸움. 사드·마르키·월크로 진형을 짜고 봇과 1:1로 겨루는 12×12 전략 보드게임."
    />

    <!-- Open Graph / Twitter. og:image is relative so the build works on any host and inside the
         Android WebView; most crawlers need an absolute URL, so replace it with
         https://<your-domain>/og.png once the production domain is fixed (see docs/store-listing.md). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="GRID CLASH" />
    <meta property="og:title" content="GRID CLASH — 12×12 전술 아레나" />
    <meta
      property="og:description"
      content="말 3개, 144칸, 60초의 수 싸움. 진형을 짜고 봇과 1:1로 겨루는 전략 보드게임. 설치 없이 바로 플레이!"
    />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GRID CLASH — 파랑 말과 빨강 말이 겨루는 12×12 보드" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GRID CLASH — 12×12 전술 아레나" />
    <meta name="twitter:description" content="말 3개, 144칸, 60초의 수 싸움. 지금 브라우저에서 바로 플레이." />
    <meta name="twitter:image" content="./og.png" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Static boot splash (replaced by the router on boot; it waits for the brand fonts, max
         ~0.9 s, then cross-fades). Inline + system fonts only so the first paint is already on brand.
         Scoped to .boot-* classes. -->
    <style>
      html,
      body {
        margin: 0;
        background: #2a59b8;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        overflow: hidden;
        background:
          radial-gradient(70% 45% at 30% 10%, rgba(255, 255, 255, 0.22), transparent 70%),
          linear-gradient(180deg, #4f8ee8, #2a59b8);
        color: #f4f7ff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .boot::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 42%;
        width: 900px;
        height: 900px;
        margin: -450px 0 0 -450px;
        background: repeating-conic-gradient(rgba(255, 220, 140, 0.06) 0deg 5deg, transparent 5deg 18deg);
        -webkit-mask-image: radial-gradient(closest-side, #000 10%, transparent 62%);
        mask-image: radial-gradient(closest-side, #000 10%, transparent 62%);
        animation: boot-spin 60s linear infinite;
      }
      .boot__logo {
        position: relative;
        width: 104px;
        height: 104px;
        border-radius: 26px;
        box-shadow:
          0 0 0 2px rgba(255, 213, 86, 0.55),
          0 0 40px rgba(255, 195, 40, 0.35),
          0 14px 30px rgba(0, 0, 0, 0.6);
        animation: boot-in 520ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .boot__name {
        position: relative;
        margin: 14px 0 0;
        font-size: 34px;
        font-style: italic;
        font-weight: 900;
        letter-spacing: 0.01em;
        line-height: 1;
        color: #fff;
        text-shadow: 0 3px 0 #000, 0 0 24px rgba(255, 160, 20, 0.35);
        animation: boot-in 520ms 80ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .boot__name b {
        color: #ffc328;
      }
      .boot__sub {
        position: relative;
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        color: #fff6d1;
        opacity: 0.85;
      }
      .boot__bar {
        position: relative;
        width: 148px;
        height: 4px;
        margin-top: 22px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      .boot__bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #ffd556, #fff6d1);
        box-shadow: 0 0 10px #ffc328;
        animation: boot-load 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
      }
      @keyframes boot-load {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot::before,
        .boot__logo,
        .boot__name,
        .boot__bar i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" aria-live="off">
      <div class="boot" role="status" aria-label="GRID CLASH 불러오는 중">
        <img class="boot__logo" src="./icons/icon-192.png" width="104" height="104" alt="" />
        <p class="boot__name">GRID <b>CLASH</b></p>
        <p class="boot__sub">12×12 전술 아레나</p>
        <div class="boot__bar" aria-hidden="true"><i></i></div>
        <noscript><p class="boot__sub">이 게임을 하려면 JavaScript를 켜 주세요.</p></noscript>
      </div>
    </div>
    <div id="overlay-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
