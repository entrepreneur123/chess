<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B1020" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GRID CLASH" />
    <meta name="application-name" content="GRID CLASH" />
    <title>GRID CLASH — 12×12 전술 아레나</title>
    <meta
      name="description"
      content="말 3개, 144칸, 60초의 수 싸움. 사드·마르키·월크로 진형을 짜고 봇과 1:1로 겨루는 12×12 전략 보드게임."
    />

    <!-- Open Graph / Twitter. og:image is relative so the build works on any host and inside the
         Android WebView; most crawlers need an absolute URL, so replace it with
         https://<your-domain>/og.png once the production domain is fixed (see docs/store-listing.md). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="GRID CLASH" />
    <meta property="og:title" content="GRID CLASH — 12×12 전술 아레나" />
    <meta
      property="og:description"
      content="말 3개, 144칸, 60초의 수 싸움. 진형을 짜고 봇과 1:1로 겨루는 전략 보드게임. 설치 없이 바로 플레이!"
    />
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GRID CLASH — 파랑 말과 빨강 말이 겨루는 12×12 보드" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GRID CLASH — 12×12 전술 아레나" />
    <meta name="twitter:description" content="말 3개, 144칸, 60초의 수 싸움. 지금 브라우저에서 바로 플레이." />
    <meta name="twitter:image" content="./og.png" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Static boot splash (replaced by the router on boot). Scoped to .boot-* classes. -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0b1020;
        color: #f3f6ff;
        font-family: Roboto, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, -apple-system, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .boot__logo {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 8px 24px rgba(26, 115, 232, 0.25);
        animation: boot-in 420ms cubic-bezier(0.05, 0.7, 0.1, 1) both;
      }
      .boot__name {
        margin: 6px 0 0;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      .boot__sub {
        margin: 0;
        font-size: 13px;
        color: #aab6d6;
      }
      .boot__dots {
        display: flex;
        gap: 8px;
        margin-top: 18px;
      }
      .boot__dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #1a73e8;
        animation: boot-dot 1s ease-in-out infinite;
      }
      .boot__dots i:nth-child(2) {
        background: #f9ab00;
        animation-delay: 0.15s;
      }
      .boot__dots i:nth-child(3) {
        background: #d93025;
        animation-delay: 0.3s;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
      }
      @keyframes boot-dot {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__logo,
        .boot__dots i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" aria-live="off">
      <div class="boot" role="status" aria-label="GRID CLASH 불러오는 중">
        <img class="boot__logo" src="./icons/icon-192.png" width="96" height="96" alt="" />
        <p class="boot__name">GRID CLASH</p>
        <p class="boot__sub">12×12 전술 아레나</p>
        <div class="boot__dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <noscript><p class="boot__sub">이 게임을 하려면 JavaScript를 켜 주세요.</p></noscript>
      </div>
    </div>
    <div id="overlay-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
