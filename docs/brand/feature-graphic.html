<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<!--
  Google Play feature graphic (1024x500), v6 "Clean Tactical" on the Dark Arena palette.
  Rendered by docs/store-assets/capture.mjs (stage "feature") to docs/brand/out/feature-graphic-1024x500.png.
  docs/brand/render.mjs also renders it (and ?og, a 1200x630 Open Graph layout). Every URL is relative,
  so it works from file:// and from the Vite dev server: the app's bundled fonts (src/styles/fonts.css:
  Black Han Sans display, Pretendard body, Exo 2 wordmark), the real character illustrations
  (docs/brand/illust) and the arena backdrop (docs/brand/bg/match.png). No UI is faked here.
-->
<link rel="stylesheet" href="../../src/styles/fonts.css" />
<style>
  :root {
    --night-0: #070a12; --night-1: #0d1322; --panel: #1b2338; --line: #33405f;
    --ink: #eef2ff; --ink-muted: #b4bfdc; --outline: #05070d;
    --gold: #f2c14e; --gold-hi: #ffe7a3; --gold-deep: #c8891e;
    --blue: 59, 139, 255; --red: 255, 70, 85; --cyan: 120, 220, 255; --arcane: 139, 108, 255;
    --W: 1024px; --H: 500px; --k: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; }
  body {
    position: relative;
    font-family: 'Pretendard', system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--night-1), var(--night-0));
  }
  .stage { position: absolute; left: 0; top: 0; width: 1024px; height: 500px; transform-origin: 0 0; transform: scale(var(--k)); overflow: hidden; }
  /* Arena backdrop (the game's own match backdrop), darkened toward the copy side. */
  .bg {
    position: absolute; inset: -40px; background: url(./bg/match.png) 50% 30% / cover;
    filter: saturate(1.1) brightness(0.8);
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(420px 300px at 78% 46%, rgba(var(--arcane), 0.42), transparent 70%),
      radial-gradient(520px 260px at 64% 100%, rgba(var(--blue), 0.45), transparent 70%),
      radial-gradient(420px 220px at 100% 0%, rgba(var(--red), 0.35), transparent 70%);
  }
  /* Tactical-hologram floor: the board's glowing grid, red zone far, blue zone near. */
  .floor { position: absolute; left: 330px; right: -260px; bottom: -40px; height: 300px; perspective: 360px; perspective-origin: 50% 0%;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 45%); mask-image: linear-gradient(180deg, transparent 0%, #000 45%); }
  .floor i {
    position: absolute; left: 50%; bottom: 0; width: 820px; height: 820px;
    transform: translateX(-50%) rotateX(64deg); transform-origin: 50% 100%;
    background:
      linear-gradient(180deg, rgba(var(--red), 0.3), transparent 24%, transparent 74%, rgba(var(--blue), 0.42)),
      linear-gradient(rgba(var(--cyan), 0.5) 1.5px, transparent 1.5px) 0 0 / 100% 8.333%,
      linear-gradient(90deg, rgba(var(--cyan), 0.5) 1.5px, transparent 1.5px) 0 0 / 8.333% 100%,
      rgba(13, 19, 34, 0.55);
    box-shadow: 0 0 0 2px rgba(var(--cyan), 0.6), 0 0 60px rgba(var(--blue), 0.5);
  }
  /* The squad: real character illustrations, edges dissolved into the arena. */
  .fig { position: absolute; aspect-ratio: 3 / 4; }
  .fig img {
    display: block; width: 100%; height: 100%; object-fit: cover;
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 46%, #000 56%, transparent 100%);
            mask-image: radial-gradient(ellipse 50% 50% at 50% 46%, #000 56%, transparent 100%);
  }
  .fig--c { left: 548px; top: -2px; height: 500px; z-index: 3; }
  .fig--l { left: 446px; top: 112px; height: 350px; z-index: 2; }
  .fig--r { left: 818px; top: 70px; height: 380px; z-index: 2; }
  .fig--l img, .fig--r img { filter: brightness(0.78) saturate(0.95); }
  /* Darkening wash so the copy always sits on a calm field (contrast >= 4.5:1). */
  .wash { position: absolute; inset: 0; z-index: 4;
    background: linear-gradient(90deg, rgba(7, 10, 18, 0.95) 0%, rgba(7, 10, 18, 0.86) 36%, rgba(7, 10, 18, 0.3) 47%, transparent 55%); }
  .vignette { position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(130% 120% at 60% 50%, transparent 60%, rgba(7, 10, 18, 0.7) 100%); }
  /* HUD corner brackets, as on the in-game board bezel. */
  .hud { position: absolute; inset: 16px; z-index: 6; pointer-events: none; }
  .hud b { position: absolute; width: 34px; height: 34px; border: 0 solid rgba(var(--cyan), 0.75); filter: drop-shadow(0 0 6px rgba(var(--cyan), 0.6)); }
  .hud b:nth-child(1) { left: 0; top: 0; border-width: 3px 0 0 3px; }
  .hud b:nth-child(2) { right: 0; top: 0; border-width: 3px 3px 0 0; }
  .hud b:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 3px 3px; }
  .hud b:nth-child(4) { right: 0; bottom: 0; border-width: 0 3px 3px 0; }

  .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 470px; z-index: 7; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 78px; height: 78px; border-radius: 18px; box-shadow: 0 0 0 2px rgba(242, 193, 78, 0.7), 0 10px 24px rgba(0, 0, 0, 0.6); }
  /* Same two-tone wordmark recipe as the app (src/styles/lobby.css .wordmark). */
  .wordmark { display: flex; gap: 0.22em; font: italic 900 64px/1 'Exo 2', sans-serif; letter-spacing: -0.01em; white-space: nowrap; }
  .wordmark span { position: relative; padding: 0 0.06em; color: transparent; }
  .wordmark span::before, .wordmark span::after { content: attr(data-text); position: absolute; inset: 0; padding: inherit; }
  .wordmark span::before { color: var(--outline); -webkit-text-stroke: 0.17em var(--outline); text-shadow: 0 0.1em 0 var(--outline), 0 0.2em 0.5em rgba(0, 0, 0, 0.6); }
  .wordmark span:last-child::before { text-shadow: 0 0.1em 0 var(--outline), 0 0 0.6em rgba(242, 193, 78, 0.4), 0 0.2em 0.5em rgba(0, 0, 0, 0.6); }
  .wordmark span::after { -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .wordmark span:first-child::after { background-image: linear-gradient(180deg, #fff 0 50%, #c3cdea 50% 100%); }
  .wordmark span:last-child::after { background-image: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 50%, var(--gold-deep) 50% 100%); }
  .tag { margin-top: 10px; font: 800 17px/1 'Pretendard', sans-serif; letter-spacing: 0.32em; color: #8fd8ff; text-shadow: 0 0 12px rgba(var(--cyan), 0.5); }
  .hook {
    margin-top: 26px; font: 400 46px/1.16 'Black Han Sans', sans-serif; color: var(--ink); word-break: keep-all;
    text-shadow: -2px -2px 0 var(--outline), 2px -2px 0 var(--outline), -2px 2px 0 var(--outline), 2px 2px 0 var(--outline), 0 5px 0 var(--outline), 0 8px 18px rgba(0, 0, 0, 0.6);
  }
  .hook em { font-style: normal; color: var(--gold); }
  .chips { display: flex; gap: 8px; margin-top: 24px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; font: 800 16px/1 'Pretendard', sans-serif; color: var(--ink);
    background: rgba(27, 35, 56, 0.92); box-shadow: inset 0 0 0 1.5px var(--line), inset 0 2px 0 rgba(255, 255, 255, 0.06); }
  .chip i { width: 9px; height: 9px; transform: rotate(45deg); border-radius: 2px; background: linear-gradient(135deg, var(--gold-hi), var(--gold) 50%, var(--gold-deep)); }
  .chip--gold { color: #2a1803; background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-deep)); box-shadow: 0 3px 0 #6e4510; }

  body.og { --W: 1200px; --H: 630px; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="bg"></div>
    <div class="glow"></div>
    <div class="floor"><i></i></div>
    <div class="fig fig--l"><img src="./illust/illust-walk-lv3.jpg" alt="" /></div>
    <div class="fig fig--r"><img src="./illust/illust-brutile-lv3.jpg" alt="" /></div>
    <div class="fig fig--c"><img src="./illust/illust-insaner-lv3.jpg" alt="" /></div>
    <div class="wash"></div>
    <div class="vignette"></div>
    <div class="hud"><b></b><b></b><b></b><b></b></div>
    <div class="copy">
      <div class="brand">
        <img src="./out/icon-rounded-512.png" alt="" />
        <div>
          <div class="wordmark" role="img" aria-label="GRID CLASH"><span data-text="GRID">GRID</span><span data-text="CLASH">CLASH</span></div>
          <div class="tag">12×12 TACTICS ARENA</div>
        </div>
      </div>
      <p class="hook">말 <em>3</em>개, <em>144</em>칸<br />한 수의 심리전</p>
      <div class="chips">
        <span class="chip chip--gold">1:1 전술 대전</span>
        <span class="chip"><i></i>진형 편성</span>
        <span class="chip"><i></i>능력 캐릭터</span>
      </div>
    </div>
  </div>
<script>
  // ?og: the same composition scaled into 1200x630 (the 1024x500 stage is centred and scaled to cover).
  if (location.search.includes('og')) {
    document.body.classList.add('og');
    const k = Math.max(1200 / 1024, 630 / 500);
    const st = document.getElementById('stage');
    st.style.setProperty('--k', k);
    st.style.left = (1200 - 1024 * k) / 2 + 'px';
    st.style.top = (630 - 500 * k) / 2 + 'px';
  }
  window.ready = Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() =>
    Promise.all([
      document.fonts.load('italic 900 64px "Exo 2"', 'GRID'),
      document.fonts.load('46px "Black Han Sans"', '말칸'),
      document.fonts.load('800 16px Pretendard', '전술'),
    ]).then(() => document.fonts.ready),
  );
</script>
</body>
</html>
