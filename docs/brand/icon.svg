<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tactics 12 app icon master (full-bleed square; launchers and Google Play apply their own mask).
       Motif: on a 3x3 slice of the board, the blue piece leaps (amber arc) onto the red piece.
       Everything important sits inside the central 80% circle so the maskable crop stays safe. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DF6"/>
      <stop offset="0.55" stop-color="#1A73E8"/>
      <stop offset="1" stop-color="#1557B8"/>
    </linearGradient>
    <radialGradient id="blue" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#6AA6FA"/>
      <stop offset="0.5" stop-color="#1A73E8"/>
      <stop offset="1" stop-color="#1250A8"/>
    </radialGradient>
    <radialGradient id="red" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#F47C70"/>
      <stop offset="0.5" stop-color="#D93025"/>
      <stop offset="1" stop-color="#A21F17"/>
    </radialGradient>
    <filter id="board" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0B2E6B" flood-opacity="0.35"/>
    </filter>
    <filter id="piece" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0B2E6B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- soft light sweep -->
  <path d="M0 0 H512 V170 C 360 230, 160 120, 0 200 Z" fill="#FFFFFF" opacity="0.07"/>

  <!--content-->
  <!-- board slice: 3x3 tiles of 96 with 10 gap = 308, centred (102..410) -->
  <g filter="url(#board)">
    <rect x="86" y="86" width="340" height="340" rx="44" fill="#FFFFFF"/>
  </g>
  <g>
    <rect x="102" y="102" width="96" height="96" rx="20" fill="#E8F0FE"/>
    <rect x="208" y="102" width="96" height="96" rx="20" fill="#F8F9FA"/>
    <rect x="314" y="102" width="96" height="96" rx="20" fill="#FCE8E6"/>
    <rect x="102" y="208" width="96" height="96" rx="20" fill="#F8F9FA"/>
    <rect x="208" y="208" width="96" height="96" rx="20" fill="#E8F0FE"/>
    <rect x="314" y="208" width="96" height="96" rx="20" fill="#F8F9FA"/>
    <rect x="102" y="314" width="96" height="96" rx="20" fill="#D3E3FD"/>
    <rect x="208" y="314" width="96" height="96" rx="20" fill="#F8F9FA"/>
    <rect x="314" y="314" width="96" height="96" rx="20" fill="#E8F0FE"/>
  </g>

  <!-- jump arc: from blue (150,362) up and over to red (362,150) -->
  <path d="M168 318 C 170 220, 232 168, 312 162" fill="none" stroke="#F9AB00" stroke-width="20" stroke-linecap="round"/>
  <path d="M300 136 L334 162 L300 190 Z" fill="#F9AB00" stroke="#F9AB00" stroke-width="8" stroke-linejoin="round"/>

  <!-- red piece (target) -->
  <g filter="url(#piece)">
    <circle cx="362" cy="150" r="40" fill="url(#red)"/>
    <circle cx="362" cy="150" r="40" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M345 141 L362 158 L379 141" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- blue piece (hero) -->
  <g filter="url(#piece)">
    <circle cx="150" cy="362" r="46" fill="url(#blue)"/>
    <circle cx="150" cy="362" r="46" fill="none" stroke="#FFFFFF" stroke-width="7"/>
    <path d="M129 373 L150 352 L171 373" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!--/content-->
</svg>
