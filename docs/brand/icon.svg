<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- GRID CLASH app icon master (full-bleed square; launchers and Google Play apply their own mask).
       Motif: on a 3x3 slice of the board, the blue piece leaps (amber arc) onto the red piece.
       Everything important sits inside the central 80% circle so the maskable crop stays safe. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3A66"/>
      <stop offset="0.55" stop-color="#141D38"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <radialGradient id="blue" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8ABEFF"/>
      <stop offset="0.5" stop-color="#3D8BFF"/>
      <stop offset="1" stop-color="#1D5FD6"/>
    </radialGradient>
    <radialGradient id="red" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FF8E8E"/>
      <stop offset="0.5" stop-color="#FF4D4F"/>
      <stop offset="1" stop-color="#C62828"/>
    </radialGradient>
    <filter id="board" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="piece" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- soft light sweep -->
  <path d="M0 0 H512 V170 C 360 230, 160 120, 0 200 Z" fill="#3D8BFF" opacity="0.12"/>

  <!--content-->
  <!-- board slice: 3x3 tiles of 96 with 10 gap = 308, centred (102..410) -->
  <g filter="url(#board)">
    <rect x="86" y="86" width="340" height="340" rx="44" fill="#0A0F1D" stroke="#3A4A75" stroke-width="4"/>
  </g>
  <g>
    <rect x="102" y="102" width="96" height="96" rx="20" fill="#4A1F2E"/>
    <rect x="208" y="102" width="96" height="96" rx="20" fill="#5A2436"/>
    <rect x="314" y="102" width="96" height="96" rx="20" fill="#4A1F2E"/>
    <rect x="102" y="208" width="96" height="96" rx="20" fill="#283555"/>
    <rect x="208" y="208" width="96" height="96" rx="20" fill="#1F2B45"/>
    <rect x="314" y="208" width="96" height="96" rx="20" fill="#283555"/>
    <rect x="102" y="314" width="96" height="96" rx="20" fill="#1D3566"/>
    <rect x="208" y="314" width="96" height="96" rx="20" fill="#244079"/>
    <rect x="314" y="314" width="96" height="96" rx="20" fill="#1D3566"/>
  </g>

  <!-- jump arc: from blue (150,362) up and over to red (362,150) -->
  <path d="M168 318 C 170 220, 232 168, 312 162" fill="none" stroke="#FFC247" stroke-width="20" stroke-linecap="round"/>
  <path d="M300 136 L334 162 L300 190 Z" fill="#FFC247" stroke="#FFC247" stroke-width="8" stroke-linejoin="round"/>

  <!-- red piece (target) -->
  <g filter="url(#piece)">
    <circle cx="362" cy="150" r="40" fill="url(#red)"/>
    <circle cx="362" cy="150" r="40" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M345 141 L362 158 L379 141" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- blue piece (hero) -->
  <g filter="url(#piece)">
    <circle cx="150" cy="362" r="46" fill="url(#blue)"/>
    <circle cx="150" cy="362" r="46" fill="none" stroke="#FFFFFF" stroke-width="7"/>
    <path d="M129 373 L150 352 L171 373" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!--/content-->
</svg>
